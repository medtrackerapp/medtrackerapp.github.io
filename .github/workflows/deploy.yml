name: Deploy to GitHub Pages

# Deploys main once its Tests run passes (tests.yml), so a change that breaks the tests never
# goes live. Run by hand (Actions → Run workflow) to deploy without waiting.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # The commit the tests passed on (a hand-run deploys the latest main)
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Build site with Firebase config from secret
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::FIREBASE_CONFIG secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          mkdir _site
          cp -r index.html style.css app.js medicines.js sw.js manifest.webmanifest icons _site/
          # Bust browser caches: each deploy gets new asset URLs, and the offline cache (sw.js) a new version.
          sed -i "s/?v=dev/?v=${SHA::8}/g" _site/index.html _site/app.js
          sed -i "s/const VERSION = \"dev\";/const VERSION = \"${SHA::8}\";/" _site/sw.js
          grep -q "const VERSION = \"${SHA::8}\";" _site/sw.js # fail the deploy if the version wasn't put in
          printf 'export const firebaseConfig = %s;\n' "$FIREBASE_CONFIG" > _site/firebase-config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
