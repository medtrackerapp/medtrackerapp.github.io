name: Update the users Google Sheet

# Every hour, rewrite the People and Guest trackers tabs and refresh the Daily summary
# (see cleanup/sheet-report.js). Free on a public repo.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheet
  cancel-in-progress: false

jobs:
  sheet:
    runs-on: ubuntu-latest
    # Skips (no failure emails) until the SHEET_ID secret is added
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
    defaults:
      run:
        working-directory: cleanup
    steps:
      - name: Check the Sheet is set up
        id: setup
        working-directory: . # cleanup/ isn't checked out yet
        run: echo "ready=$([ -n "$SHEET_ID" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'yes'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'yes'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cleanup/package-lock.json

      - run: npm ci
        if: steps.setup.outputs.ready == 'yes'

      - name: Update the Sheet
        if: steps.setup.outputs.ready == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run sheet
